<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha - Milênio Embalagens</title>
<style>
:root { --bg: #f4f4f2; --card: #fff; --ink: #142033; --mut: #5b6678; --line: #dcdcd8; --blue: #174d86; --y: #e6c84a }
@media (prefers-color-scheme: dark) { :root { --bg: #10151f; --card: #1a2230; --ink: #eef2f8; --mut: #9aa6b8; --line: #2b3648; --blue: #8cb8f0 } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px 32px }
.card { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px }
.brand { font-size: 12px; letter-spacing: .08em; color: var(--blue); font-weight: 700; margin-bottom: 10px }
h1 { margin: 0 0 2px; font-size: 1.5rem }
.sub { color: var(--mut); margin-bottom: 14px }
table { width: 100%; border-collapse: collapse }
td { padding: 10px 4px; border-top: 1px solid var(--line); vertical-align: top }
td:first-child { color: var(--mut); width: 42% }
td:last-child { font-weight: 700; overflow-wrap: anywhere }
.nota { color: var(--mut); font-size: 13px; margin-top: 12px }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px }
button { font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; flex: 1 1 140px }
button.p { background: var(--y); border-color: var(--y); color: #142033 }
.erro { color: #b3261e; font-weight: 600 }
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
// A ficha vem dentro do próprio endereço (depois do #): nada é enviado ao servidor e não precisa de login.
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const data = p => { const m = String(p || '').match(/(\d+)-(\d+)-(\d+)/); return m ? m[3] + '/' + m[2] + '/' + m[1] : (p || '-') };
function ler() {
    const raw = location.hash.slice(1).split('|'), tipo = raw[0], v = raw.slice(1).map(x => { try { return decodeURIComponent(x.replace(/\+/g, ' ')) } catch (e) { return x } });
    return { tipo, v }
}
function montar() {
    const { tipo, v } = ler(); let tit, sub, linhas;
    if (tipo === 'M' && v.length >= 7) {
        tit = 'Máquina ' + v[0]; sub = v[1];
        linhas = [['Código', v[0]], ['Nome', v[1]], ['Capacidade nominal', v[2] + ' pç/h'], ['Status', v[3]], ['OP atual', v[4]], ['Produzido hoje', v[5] + ' peças'], ['Tópico MQTT', 'milenio/maq' + v[0] + '/producao']];
    } else if (tipo === 'OP' && v.length >= 8) {
        tit = 'OP ' + v[0]; sub = v[1].replace(/^[^-]*- /, '');
        linhas = [['Número da OP', v[0]], ['Produto', v[1]], ['Revisão do desenho', v[2]], ['Quantidade planejada', v[3]], ['Produzido', v[4]], ['Máquina', v[5]], ['Prazo', data(v[6])], ['Status', v[7]]]; if (v.length >= 10) linhas.push(['Prioridade', v[8]]);
    } else { $('#c').innerHTML = '<div class="brand">MILÊNIO EMBALAGENS</div><p class="erro">QR Code não reconhecido.</p>'; return }
    const quando = v[v.length - 1], texto = 'MILÊNIO - ' + tit.toUpperCase() + '\n' + linhas.map(l => l[0] + ': ' + l[1]).join('\n') + '\nDados de ' + quando;
    document.title = tit + ' - Milênio';
    $('#c').innerHTML = '<div class="brand">MILÊNIO EMBALAGENS</div><h1>' + esc(tit) + '</h1><div class="sub">' + esc(sub) + '</div><table>' + linhas.map(l => '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]) + '</td></tr>').join('') + '</table><div class="nota">Dados de ' + esc(quando) + ' (momento em que o QR Code foi gerado).</div><div class="row"><button id="cp">Copiar dados</button>' + (navigator.share ? '<button class="p" id="sh">Compartilhar / Notas</button>' : '') + '</div><div class="nota" id="ok"></div>';
    $('#cp').onclick = () => { const fim = () => $('#ok').textContent = 'Copiado. Cole no app de Notas.'; if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(fim, () => { }); else { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); fim() } catch (e) { } t.remove() } };
    if ($('#sh')) $('#sh').onclick = () => navigator.share({ title: tit, text: texto }).catch(() => { });
}
addEventListener('hashchange', montar); montar();
</script>
</body>
</html>
